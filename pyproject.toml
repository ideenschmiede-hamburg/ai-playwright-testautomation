[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-playwright-testing-squad"
version = "0.1.0"
description = "Autonomous, agent-orchestrated Playwright testing framework"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mcp>=1.0",
    "playwright>=1.49",
    "pydantic>=2.10",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-html>=4.1",
    "pytest-playwright>=0.6",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_testing"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "ANN",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PERF",
    "PL",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
]
ignore = [
    "ANN401",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
namespace_packages = true
show_error_codes = true
show_column_numbers = true
pretty = true
warn_unreachable = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [
    ".venv",
    "artifacts",
]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "strict"
markers = [
    "integration: tests involving external adapters",
    "browser: tests requiring a Playwright browser",
    "generated: autonomously generated regression tests",
]